[project]
name = "mamba_ssm"
description = "Mamba state-space model"
readme = "README.md"
authors = [
    { name = "Tri Dao", email = "tri@tridao.me" },
    { name = "Albert Gu", email = "agu@cs.cmu.edu" }
]
requires-python = ">=3.9"
dynamic = ["version"]
license = { file = "LICENSE" }  # Include a LICENSE file in your repo
keywords = ["cuda", "pytorch", "state-space model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix"
]
dependencies = [
    "torch",
    "ninja",
    "numpy",
    "einops",
    "transformers",
    "packaging",
    "setuptools>=61.0.0",
]
[project.urls]
Repository = "https://github.com/state-spaces/mamba"

[project.optional-dependencies]
train = [
    "wandb",
    "google-cloud-storage",
    "datasets",
    "zstandard",
]
# Pinned environment used for the HPML final V100/CUDA 12.4 experiments.
# Install with the matching CUDA PyTorch index, for example:
#   pip install --extra-index-url https://download.pytorch.org/whl/cu124 -e '.[hpml-v100]' --no-build-isolation
hpml-v100 = [
    "torch==2.6.0",
    "triton==3.2.0",
    "transformers==5.7.0",
    "causal-conv1d==1.6.0",
    "numpy==2.2.5",
    "einops==0.8.1",
    "packaging==24.2",
    "setuptools==75.8.0",
    "wheel==0.45.1",
    "ninja==1.11.1.3",
    "wandb==0.19.9",
    "datasets==3.6.0",
    "zstandard==0.23.0",
    "google-cloud-storage==3.1.0",
    "matplotlib==3.10.3",
    "pandas==2.2.3",
    "huggingface-hub==0.31.2",
    "vllm==0.8.5",
]
causal-conv1d = [
    "causal-conv1d>=1.2.0,<1.6; python_version < '3.10'",
    "causal-conv1d>=1.6.0; python_version >= '3.10'"
]
triton = [
    "triton>=3.2.0"
]
mamba3 = [
    "triton>=3.2.0",
    "tilelang==0.1.8",
    "quack-kernels==0.3.4"
]
full = [
    "wandb",
    "google-cloud-storage",
    "datasets",
    "zstandard",
    "causal-conv1d>=1.2.0,<1.6; python_version < '3.10'",
    "causal-conv1d>=1.6.0; python_version >= '3.10'",
    "triton>=3.2.0",
    "tilelang==0.1.8",
    "quack-kernels==0.3.4"
]
dev = [
    "pytest"
]


[build-system]
# torch is intentionally excluded: pip's build isolation would install
# torch-cpu from PyPI, ignoring the user's CUDA-enabled torch.
# Users building from source should install torch first, then:
#   pip install mamba-ssm --no-build-isolation
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "packaging",
    "ninja",
]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ["mamba-ssm"]
